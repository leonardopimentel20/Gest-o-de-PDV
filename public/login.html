<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Loja de Variedades</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border-top: 4px solid #dc2626;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #111;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .password-container input {
            padding-right: 45px;
        }

        .password-container button {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }

        .login-card button.btn-entrar {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            background-color: #111;
            color: white;
            border: none;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .login-card button.btn-entrar:hover {
            background-color: #333;
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <form onsubmit="fazerLogin(event)">
        <div class="login-card">
            <h2>Entrar no Sistema</h2>
            <div class="form-group">
                <label>Usuário:</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label>Senha:</label>
                <div class="password-container">
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                    <button type="button" id="toggleSenha" onclick="togglePasswordVisibility()"
                        title="Mostrar/Ocultar senha">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" id="btnEntrar" class="btn-entrar">Entrar</button>
            <div id="erroMsg" class="error-msg"></div>
        </div>
    </form>

    <script>
        const API_URL = 'http://localhost:3000';

        function togglePasswordVisibility() {
            const inputSenha = document.getElementById('senha');
            const botaoToggle = document.getElementById('toggleSenha');

            if (inputSenha.type === 'password') {
                inputSenha.type = 'text';
                botaoToggle.textContent = '🙈';
            } else {
                inputSenha.type = 'password';
                botaoToggle.textContent = '👁️';
            }
        }

        async function fazerLogin(event) {
            if (event) event.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erroMsg = document.getElementById('erroMsg');
            erroMsg.innerText = '';

            if (!nome || !senha) {
                erroMsg.innerText = 'Preencha todos os campos!';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));

                    if (data.usuario.cargo === 'operador') {
                        window.location.href = 'caixa.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    erroMsg.innerText = data.error || 'Usuário ou senha incorretos.';
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                erroMsg.innerText = 'Erro de conexão com o servidor.';
            }
        }
    </script>
</body>

</html>
